<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Shadow Parser — Demo</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, sans-serif;
            background: #0f0f13;
            color: #e0e0e8;
            padding: 40px 24px;
            min-height: 100vh;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: .04em;
            color: #fff;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: .85rem;
            color: #666;
            margin-bottom: 40px;
        }

        /* ── Custom input ───────────────────────────────────────── */

        .custom-panel {
            background: #18181f;
            border: 1px solid #2a2a35;
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 40px;
        }

        .custom-panel label {
            display: block;
            font-size: .75rem;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 8px;
        }

        #custom-input {
            width: 100%;
            background: #0f0f13;
            border: 1px solid #2e2e3a;
            border-radius: 8px;
            padding: 10px 14px;
            color: #e0e0e8;
            font-family: 'Fira Code', 'Cascadia Code', monospace;
            font-size: .85rem;
            outline: none;
            resize: vertical;
            min-height: 80px;
            transition: border-color .15s;
            line-height: 1.6;
        }

        #custom-input:focus { border-color: #6c63ff; }

        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .parse-btn {
            background: #6c63ff;
            border: none;
            border-radius: 8px;
            padding: 10px 24px;
            color: #fff;
            font-size: .85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s;
        }

        .parse-btn:hover { background: #5a52e0; }

        .clear-btn {
            background: transparent;
            border: 1px solid #2e2e3a;
            border-radius: 8px;
            padding: 10px 20px;
            color: #888;
            font-size: .85rem;
            font-weight: 600;
            cursor: pointer;
            transition: border-color .15s, color .15s;
        }

        .clear-btn:hover { border-color: #555; color: #ccc; }

        #custom-result {
            margin-top: 10px;
            font-size: .8rem;
            font-family: 'Fira Code', monospace;
            color: #aaa;
        }

        /* ── Examples grid ──────────────────────────────────────── */

        .section-title {
            font-size: .7rem;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: #555;
            margin-bottom: 16px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 48px;
        }

        .card {
            background: #18181f;
            border: 1px solid #2a2a35;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: border-color .15s;
        }

        .card:hover { border-color: #6c63ff55; }
        .card.active { border-color: #6c63ff; }

        .card-preview {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 90px;
            margin-bottom: 16px;
        }

        .shadow-box {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            background: #ffffff;
        }

        .card-label {
            font-size: .78rem;
            font-weight: 600;
            color: #ccc;
            margin-bottom: 4px;
        }

        .card-css {
            font-size: .72rem;
            font-family: 'Fira Code', 'Cascadia Code', monospace;
            color: #6c63ff;
            word-break: break-all;
            line-height: 1.5;
        }

        /* ── Parse output ───────────────────────────────────────── */

        .output-panel {
            background: #18181f;
            border: 1px solid #2a2a35;
            border-radius: 12px;
            padding: 20px 24px;
        }

        .output-panel .section-title { margin-bottom: 12px; }

        #output {
            max-height: 340px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .json-output {
            background: #0f0f13;
            border: 1px solid #2a2a35;
            border-radius: 8px;
            padding: 16px 20px;
            font-family: 'Fira Code', 'Cascadia Code', monospace;
            font-size: .82rem;
            line-height: 1.7;
            white-space: pre;
            overflow-x: auto;
        }

        .j-bracket   { color: #888; }
        .j-key       { color: #9cdcfe; }
        .j-str       { color: #ce9178; }
        .j-num       { color: #b5cea8; }
        .j-bool      { color: #569cd6; }
        .j-swatch    {
            display: inline-block;
            width: 10px; height: 10px;
            border-radius: 2px;
            border: 1px solid #444;
            vertical-align: middle;
            margin-left: 6px;
            position: relative;
            top: -1px;
        }

        .empty-state {
            color: #444;
            font-size: .85rem;
            text-align: center;
            padding: 24px 0;
        }
    </style>
</head>
<body>

<h1>Box Shadow Parser</h1>
<p class="subtitle">Click any example or type your own CSS value to inspect the parsed output.</p>

<!-- Custom input -->
<div class="custom-panel">
    <label>Try your own</label>
    <textarea id="custom-input" placeholder="e.g. 4px 8px 24px rgba(0,0,0,.5)  or  box-shadow: 0 2px 4px rgba(0,0,0,.3);"></textarea>
    <div class="btn-row">
        <button class="parse-btn" onclick="parseCustom()">Parse</button>
        <button class="clear-btn" onclick="clearAll()">Clear</button>
    </div>
    <div id="custom-result"></div>
</div>

<!-- Parse output -->
<div class="output-panel">
    <p class="section-title">Parsed layers</p>
    <div id="output"><p class="empty-state">Select an example or enter a value above.</p></div>
</div>

<!-- Example cards -->
<p class="section-title">Examples</p>
<div class="grid" id="cards"></div>

<script src="parser.js"></script>
<script>
const EXAMPLES = [
    {
        label: 'Simple drop shadow',
        css: '4px 4px 10px rgba(0,0,0,0.4)',
        bg: '#ffffff',
    },
    {
        label: 'Soft ambient glow',
        css: '0 8px 32px rgba(108,99,255,0.55)',
        bg: '#ffffff',
    },
    {
        label: 'Hard offset (comic style)',
        css: '6px 6px 0 #1a1a2e',
        bg: '#ff6b6b',
    },
    {
        label: 'Neumorphic raised',
        css: '6px 6px 12px #b8b9be, -6px -6px 12px #ffffff',
        bg: '#e0e5ec',
    },
    {
        label: 'Neumorphic pressed (inset)',
        css: 'inset 4px 4px 8px #b8b9be, inset -4px -4px 8px #ffffff',
        bg: '#e0e5ec',
    },
    {
        label: 'Multi-layer depth',
        css: '0 1px 2px rgba(0,0,0,.07), 0 4px 8px rgba(0,0,0,.07), 0 12px 24px rgba(0,0,0,.07)',
        bg: '#ffffff',
    },
    {
        label: 'Colored neon glow',
        css: '0 0 8px #0ff, 0 0 20px #0ff, 0 0 40px #0ff',
        bg: '#111',
    },
    {
        label: 'Sunset gradient shadow',
        css: '4px 4px 0 #ff6b6b, 8px 8px 0 #ffa07a, 12px 12px 0 #ffd700',
        bg: '#fff',
    },
    {
        label: 'Inset + outer combo',
        css: '0 4px 16px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.25)',
        bg: '#5a52e0',
    },
    {
        label: 'Spread-only border',
        css: '0 0 0 3px #6c63ff',
        bg: '#fff',
    },
    {
        label: 'Named color shadow',
        css: '4px 4px 12px coral, -4px -4px 12px steelblue',
        bg: '#fff',
    },
    {
        label: 'Transparent + hex alpha',
        css: '0 8px 24px #00000066',
        bg: '#fff',
    },
    {
        label: 'HSL color shadow',
        css: '0 6px 20px hsl(270 80% 50% / 0.6)',
        bg: '#fff',
    },
    {
        label: 'Negative spread inset',
        css: 'inset 0 0 10px -3px rgba(0,0,0,0.5)',
        bg: '#fff',
    },
    {
        label: 'Material elevation 4',
        css: '0 2px 4px -1px rgba(0,0,0,.2), 0 4px 5px 0 rgba(0,0,0,.14), 0 1px 10px 0 rgba(0,0,0,.12)',
        bg: '#ffffff',
    },
];

function renderCards() {
    const grid = document.getElementById('cards');
    EXAMPLES.forEach((ex, i) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.index = i;
        card.innerHTML = `
            <div class="card-preview">
                <div class="shadow-box" style="background:${ex.bg};box-shadow:${ex.css}"></div>
            </div>
            <div class="card-label">${ex.label}</div>
            <div class="card-css">${ex.css}</div>
        `;
        card.addEventListener('click', () => {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            card.classList.add('active');
            renderOutput(BoxShadowParser.parse(ex.css));
            document.querySelector('.output-panel').scrollIntoView({ behavior: 'instant', block: 'start' });
        });
        grid.appendChild(card);
    });
}

function renderOutput(layers) {
    const out = document.getElementById('output');
    if (!layers.length) {
        out.innerHTML = '<p class="empty-state">No layers parsed.</p>';
        return;
    }

    const lines = [];
    lines.push(`<span class="j-bracket">[</span>`);

    layers.forEach((layer, li) => {
        const isLast = li === layers.length - 1;
        const swatchBg = layer.alpha < 1
            ? `rgba(${parseInt(layer.hex.slice(1,3),16)},${parseInt(layer.hex.slice(3,5),16)},${parseInt(layer.hex.slice(5,7),16)},${layer.alpha})`
            : layer.hex;

        const props = [
            ['inset',  layer.inset],
            ['x',      layer.x],
            ['y',      layer.y],
            ['blur',   layer.blur],
            ['spread', layer.spread],
            ['color',  layer.color],
            ['alpha',  layer.alpha],
            ['hex',    layer.hex],
        ];

        lines.push(`  <span class="j-bracket">{</span>`);
        props.forEach(([k, v], pi) => {
            const comma = pi < props.length - 1 ? ',' : '';
            const keyHtml = `<span class="j-key">"${k}"</span>`;
            let valHtml;
            if (typeof v === 'boolean') {
                valHtml = `<span class="j-bool">${v}</span>`;
            } else if (typeof v === 'number') {
                valHtml = `<span class="j-num">${v}</span>`;
            } else {
                valHtml = `<span class="j-str">"${v}"</span>`;
            }
            const swatch = (k === 'hex')
                ? `<span class="j-swatch" style="background:${swatchBg}"></span>`
                : '';
            lines.push(`    ${keyHtml}: ${valHtml}${comma}${swatch}`);
        });
        lines.push(`  <span class="j-bracket">}</span>${isLast ? '' : ','}`);
    });

    lines.push(`<span class="j-bracket">]</span>`);
    out.innerHTML = `<div class="json-output">${lines.join('\n')}</div>`;
}

function clearAll() {
    document.getElementById('custom-input').value = '';
    document.getElementById('custom-result').textContent = '';
    document.getElementById('output').innerHTML = '<p class="empty-state">Select an example or enter a value above.</p>';
    document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
}

function parseCustom() {
    const input = document.getElementById('custom-input').value.trim();
    if (!input) return;

    document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));

    const layers = BoxShadowParser.parse(input);
    document.getElementById('custom-result').textContent =
        `→ ${layers.length} layer${layers.length !== 1 ? 's' : ''} parsed`;

    renderOutput(layers);
}

document.getElementById('custom-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) parseCustom();
});

renderCards();
</script>
</body>
</html>
